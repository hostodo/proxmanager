# Include inside the existing private TLS server block. Restrict ingress to the
# control plane with the site's existing firewall / access policy.
location = /v1/power-state {
    # Replace with the verified control-plane egress address before enabling.
    # allow CONTROL_PLANE_EGRESS_IP;
    deny all;
    proxy_pass http://unix:/run/proxmanager-status/status.sock;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host localhost;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
    proxy_send_timeout 2s;
    proxy_buffering off;
    proxy_cache off;
}
